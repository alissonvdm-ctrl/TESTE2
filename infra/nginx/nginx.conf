# ---------------------------------------------------------------------------
# Nginx reverse proxy – NumericSequenceAnalyzer
# ---------------------------------------------------------------------------

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_types          text/plain text/css application/json application/javascript
                        text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length     1024;

    # ── Upload size ───────────────────────────────────────────────────────
    client_max_body_size 110m;

    # ── Upstream: FastAPI ─────────────────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect (enable when TLS certs are available) ───────
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ── Main server ───────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options           SAMEORIGIN;
        add_header X-Content-Type-Options    nosniff;
        add_header X-XSS-Protection          "1; mode=block";
        add_header Referrer-Policy           "strict-origin-when-cross-origin";

        # ── Static uploads served directly by Nginx ───────────────────────
        location /static/uploads/ {
            alias /app/uploads/;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # ── FastAPI /docs, /redoc, /openapi.json ─────────────────────────
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket upgrade ─────────────────────────────────────────────
        location /analysis/ws/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── REST API ─────────────────────────────────────────────────────
        location /api/ {
            rewrite            ^/api/(.*)$ /$1 break;
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Health check proxy ────────────────────────────────────────────
        location /health {
            proxy_pass         http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # ── Frontend SPA (React) ──────────────────────────────────────────
        # Uncomment and adjust root path after building the frontend:
        # root /usr/share/nginx/html;
        # index index.html;
        # location / {
        #     try_files $uri $uri/ /index.html;
        # }

        # Temporary root redirect to API docs while frontend is not built
        location / {
            return 302 /docs;
        }
    }
}
